services:
  mysql:
    image: mysql:8.0
    container_name: linkedout-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: linkedout_root
      MYSQL_DATABASE: linkedout
      MYSQL_USER: linkedout_user
      MYSQL_PASSWORD: linkedout_pass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: linkedout-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mysql_data:
  redis_data:
