name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  ORG: linkedout-kr

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
      experience: ${{ steps.filter.outputs.experience }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'apps/gateway/**'
            auth:
              - 'apps/auth-service/**'
            experience:
              - 'apps/experience-service/**'
            web:
              - 'apps/web/**'

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: gateway
            context: apps/gateway
            image: linkedout-gateway
            changed: ${{ needs.changes.outputs.gateway }}
          - service: auth-service
            context: apps/auth-service
            image: linkedout-auth-service
            changed: ${{ needs.changes.outputs.auth }}
          - service: experience-service
            context: apps/experience-service
            image: linkedout-experience-service
            changed: ${{ needs.changes.outputs.experience }}
          - service: web
            context: apps/web
            image: linkedout-web
            changed: ${{ needs.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      - name: Login to GHCR
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/linkedout
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
