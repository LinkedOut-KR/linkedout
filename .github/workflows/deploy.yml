name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build all services'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  ORG: linkedout-kr

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
      experience: ${{ steps.filter.outputs.experience }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'apps/gateway/**'
            auth:
              - 'apps/auth-service/**'
            experience:
              - 'apps/experience-service/**'
            web:
              - 'apps/web/**'

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: gateway
            context: apps/gateway
            image: linkedout-gateway
            changed: ${{ needs.changes.outputs.gateway }}
          - service: auth-service
            context: apps/auth-service
            image: linkedout-auth-service
            changed: ${{ needs.changes.outputs.auth }}
          - service: experience-service
            context: apps/experience-service
            image: linkedout-experience-service
            changed: ${{ needs.changes.outputs.experience }}
          - service: web
            context: apps/web
            image: linkedout-web
            changed: ${{ needs.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'

      - name: Login to GHCR
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:latest

  deploy-db:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.db.yml to DB server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DB_SERVER_HOST }}
          username: ${{ secrets.DB_SERVER_USER }}
          password: ${{ secrets.DB_SERVER_PASSWORD }}
          port: ${{ secrets.DB_SERVER_PORT }}
          source: docker-compose.db.yml
          target: /opt/linkedout

      - name: Start DB services
        uses: appleboy/ssh-action@v1
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        with:
          host: ${{ secrets.DB_SERVER_HOST }}
          username: ${{ secrets.DB_SERVER_USER }}
          password: ${{ secrets.DB_SERVER_PASSWORD }}
          port: ${{ secrets.DB_SERVER_PORT }}
          envs: MYSQL_ROOT_PASSWORD,MYSQL_USER,MYSQL_PASSWORD
          script: |
            cd /opt/linkedout
            printf 'MYSQL_ROOT_PASSWORD=%s\nMYSQL_USER=%s\nMYSQL_PASSWORD=%s\n' \
              "$MYSQL_ROOT_PASSWORD" "$MYSQL_USER" "$MYSQL_PASSWORD" > .env
            sudo docker compose -f docker-compose.db.yml up -d
            sudo docker image prune -f

  deploy-be:
    needs: deploy-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to BE server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BE_SERVER_HOST }}
          username: ${{ secrets.BE_SERVER_USER }}
          password: ${{ secrets.BE_SERVER_PASSWORD }}
          port: ${{ secrets.BE_SERVER_PORT }}
          source: docker-compose.prod.yml
          target: /opt/linkedout

      - name: Deploy BE services
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          API_URL: ${{ secrets.API_URL }}
        with:
          host: ${{ secrets.BE_SERVER_HOST }}
          username: ${{ secrets.BE_SERVER_USER }}
          password: ${{ secrets.BE_SERVER_PASSWORD }}
          port: ${{ secrets.BE_SERVER_PORT }}
          envs: GHCR_TOKEN,GHCR_USER,MYSQL_USER,MYSQL_PASSWORD,JWT_SECRET,CORS_ORIGIN,API_URL
          script: |
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/linkedout
            printf 'MYSQL_USER=%s\nMYSQL_PASSWORD=%s\nJWT_SECRET=%s\nCORS_ORIGIN=%s\nAPI_URL=%s\n' \
              "$MYSQL_USER" "$MYSQL_PASSWORD" "$JWT_SECRET" "$CORS_ORIGIN" "$API_URL" > .env
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d --force-recreate
            sleep 15
            sudo docker exec linkedout-auth-service ./node_modules/.bin/prisma db push --schema=./prisma/schema.prisma --skip-generate || true
            sudo docker image prune -f

  notify:
    needs: deploy-be
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ needs.deploy-be.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'workflow_dispatch' }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            TITLE="✅ 배포 성공"
          else
            COLOR=15158332
            TITLE="❌ 배포 실패"
          fi
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"커밋\", \"value\": \"$COMMIT_MSG\", \"inline\": false},
                  {\"name\": \"실행자\", \"value\": \"$ACTOR\", \"inline\": true},
                  {\"name\": \"로그\", \"value\": \"[Actions 보기]($RUN_URL)\", \"inline\": true}
                ]
              }]
            }"
