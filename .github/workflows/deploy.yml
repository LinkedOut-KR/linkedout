name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build all services'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  ORG: linkedout-kr

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
      experience: ${{ steps.filter.outputs.experience }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'apps/gateway/**'
            auth:
              - 'apps/auth-service/**'
            experience:
              - 'apps/experience-service/**'
            web:
              - 'apps/web/**'

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: gateway
            context: apps/gateway
            image: linkedout-gateway
            changed: ${{ needs.changes.outputs.gateway }}
          - service: auth-service
            context: apps/auth-service
            image: linkedout-auth-service
            changed: ${{ needs.changes.outputs.auth }}
          - service: experience-service
            context: apps/experience-service
            image: linkedout-experience-service
            changed: ${{ needs.changes.outputs.experience }}
          - service: web
            context: apps/web
            image: linkedout-web
            changed: ${{ needs.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'

      - name: Login to GHCR
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:latest

  deploy-db:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.db.yml to DB server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DB_SERVER_HOST }}
          username: ${{ secrets.DB_SERVER_USER }}
          password: ${{ secrets.DB_SERVER_PASSWORD }}
          port: ${{ secrets.DB_SERVER_PORT }}
          source: docker-compose.db.yml
          target: /opt/linkedout

      - name: Start DB services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DB_SERVER_HOST }}
          username: ${{ secrets.DB_SERVER_USER }}
          password: ${{ secrets.DB_SERVER_PASSWORD }}
          port: ${{ secrets.DB_SERVER_PORT }}
          script: |
            cd /opt/linkedout
            docker compose -f docker-compose.db.yml up -d
            docker image prune -f

  deploy-be:
    needs: deploy-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to BE server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BE_SERVER_HOST }}
          username: ${{ secrets.BE_SERVER_USER }}
          password: ${{ secrets.BE_SERVER_PASSWORD }}
          port: ${{ secrets.BE_SERVER_PORT }}
          source: docker-compose.prod.yml
          target: /opt/linkedout

      - name: Deploy BE services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BE_SERVER_HOST }}
          username: ${{ secrets.BE_SERVER_USER }}
          password: ${{ secrets.BE_SERVER_PASSWORD }}
          port: ${{ secrets.BE_SERVER_PORT }}
          script: |
            cd /opt/linkedout
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
