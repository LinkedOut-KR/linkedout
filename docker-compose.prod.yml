services:
  gateway:
    image: ghcr.io/linkedout-kr/linkedout-gateway:latest
    container_name: linkedout-gateway
    restart: always
    ports:
      - '4000:4000'
    environment:
      AUTH_SERVICE_URL: http://auth-service:4001
      EXPERIENCE_SERVICE_URL: http://experience-service:4002
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - auth-service
      - experience-service

  auth-service:
    image: ghcr.io/linkedout-kr/linkedout-auth-service:latest
    container_name: linkedout-auth-service
    restart: always
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@10.0.0.84:3306/linkedout
      REDIS_HOST: 10.0.0.84
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      PORT: 4001

  experience-service:
    image: ghcr.io/linkedout-kr/linkedout-experience-service:latest
    container_name: linkedout-experience-service
    restart: always
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@10.0.0.84:3306/linkedout
      REDIS_HOST: 10.0.0.84
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:4001
      PORT: 4002

  web:
    image: ghcr.io/linkedout-kr/linkedout-web:latest
    container_name: linkedout-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
